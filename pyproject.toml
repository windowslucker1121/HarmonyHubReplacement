[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-receiver"
version = "0.1.0"
description = "Capture and decode Logitech Harmony remote RF24 traffic via an nRF24L01+ radio."
requires-python = ">=3.11"
dependencies = [
    "Adafruit-Blinka>=9.2.0",
    "circuitpython-nrf24l01>=2.2.0",
    "libusb>=1.0.29",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "androidtvremote2>=0.3",
    "zeroconf>=0.132",
    "aiowebostv>=0.9",
    # For the IR backend: pigpio is a pure-Python client for the `pigpiod`
    # daemon, so it installs fine here and simply fails to connect at
    # runtime where there is no daemon or nothing wired -- see
    # `harmony_hub.ir.gateway`'s docstring for why that never raises.
    "pigpio>=1.78",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Only `harmony-deploy setup`/`inspect` (SSH-based provisioning) needs this.
# The device itself never does -- `bundle.read_requirements` reads only
# `[project.dependencies]` above, so this never ends up in a bundle's
# requirements.txt -- and `harmony-deploy push` (the HTTP path) imports it
# lazily inside `harmony_deploy.ssh` so it stays usable without it.
deploy = ["paramiko>=3.4"]

[project.scripts]
harmony-receiver = "harmony_receiver.cli:main"
harmony-hub = "harmony_hub.server:main"
harmony-deploy = "harmony_deploy.cli:main"
# The device's actual `bin/harmony-launch` is a standalone copy of
# `harmony_hub/update/launcher.py`, not an install of this entry point --
# see that module's docstring for why. Installed anyway so `harmony-launch
# <root>` also works from an ordinary dev venv, e.g. while testing the
# release layout locally.
harmony-launch = "harmony_hub.update.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
